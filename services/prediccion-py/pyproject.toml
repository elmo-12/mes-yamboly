[project]
name = "prediccion"
version = "0.1.0"
description = "Servicio de predicción en Python del MES yamboly (bloque A del contrato docs/prediccion-python.md)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.32,<1.0",
  "pydantic>=2.9,<3.0",
  "pydantic-settings>=2.6,<3.0",
  "numpy>=1.26,<3.0",
  "scikit-learn>=1.5,<2.0",
  "lightgbm>=4.5,<5.0",
  "joblib>=1.4,<2.0",
]

[project.scripts]
prediccion = "prediccion.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.3,<9.0",
  "httpx>=0.27,<1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/prediccion"]

[tool.pytest.ini_options]
testpaths = ["tests"]
